<svg viewBox="0 0 1220 400" width="1220" height="400" role="img" aria-label="Edits that move the element" xmlns="http://www.w3.org/2000/svg"><defs><marker id="p3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker><marker id="p3e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#EB6834"/></marker><marker id="p3c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1BAF7A"/></marker><marker id="p3g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D9A32B"/></marker></defs><line x1="500" y1="34" x2="500" y2="384" stroke="currentColor" stroke-opacity="0.3" stroke-width="1" stroke-dasharray="5 5"/><text x="20" y="24" font-size="15.93" text-anchor="start" font-weight="bold" fill="currentColor" fill-opacity="1.0" font-family="inherit">Transplant  —  does the element work anywhere?</text><rect x="20" y="52" width="300" height="22" rx="4" fill="currentColor" fill-opacity="0.055" stroke="currentColor" stroke-opacity="1.0" stroke-width="1.3"/><rect x="158" y="49" width="14" height="28" rx="3" fill="#D9A32B" fill-opacity="0.75" stroke="#D9A32B" stroke-opacity="1.0" stroke-width="1.3"/><text x="170" y="92" font-size="13.569999999999999" text-anchor="start" font-weight="normal" fill="currentColor" fill-opacity="0.85" font-family="inherit">the element: its whole peak, lifted out</text><line x1="170" y1="100" x2="170" y2="128" stroke="currentColor" stroke-opacity="1.0" stroke-width="1.4" marker-end="url(#p3)"/><rect x="20" y="138" width="200" height="102" rx="9" fill="#111111" fill-opacity="0.045" stroke="#111111" stroke-opacity="1.0" stroke-width="1.5"/><text x="120" y="159" font-size="14.16" text-anchor="middle" font-weight="bold" fill="#111111" fill-opacity="1.0" font-family="inherit">the element</text><text x="120" y="175" font-size="12.979999999999999" text-anchor="middle" font-weight="normal" fill="currentColor" fill-opacity="0.75" font-family="inherit">as it is</text><line x1="34" y1="196" x2="206" y2="196" stroke="#9A9993" stroke-opacity="0.22" stroke-width="2.4"/><line x1="34" y1="205" x2="206" y2="205" stroke="#9A9993" stroke-opacity="0.45" stroke-width="2.4"/><line x1="34" y1="214" x2="206" y2="214" stroke="#9A9993" stroke-opacity="1.0" stroke-width="2.4"/><rect x="92" y="202" width="56" height="24" rx="4" fill="#111111" fill-opacity="0.1" stroke="#111111" stroke-opacity="1.0" stroke-width="1.3"/><rect x="113" y="199" width="14" height="30" rx="3" fill="#D9A32B" fill-opacity="0.75" stroke="#D9A32B" stroke-opacity="1.0" stroke-width="1.2"/><rect x="250" y="138" width="200" height="102" rx="9" fill="#EB6834" fill-opacity="0.045" stroke="#EB6834" stroke-opacity="1.0" stroke-width="1.5"/><text x="350" y="159" font-size="14.16" text-anchor="middle" font-weight="bold" fill="#EB6834" fill-opacity="1.0" font-family="inherit">the same letters</text><text x="350" y="175" font-size="12.979999999999999" text-anchor="middle" font-weight="normal" fill="currentColor" fill-opacity="0.75" font-family="inherit">shuffled</text><line x1="264" y1="196" x2="436" y2="196" stroke="#9A9993" stroke-opacity="0.22" stroke-width="2.4"/><line x1="264" y1="205" x2="436" y2="205" stroke="#9A9993" stroke-opacity="0.45" stroke-width="2.4"/><line x1="264" y1="214" x2="436" y2="214" stroke="#9A9993" stroke-opacity="1.0" stroke-width="2.4"/><rect x="334" y="203" width="32" height="22" rx="3" fill="#EB6834" fill-opacity="0.45" stroke="#EB6834" stroke-opacity="1.0" stroke-width="1.1"/><rect x="223" y="203" width="24" height="24" rx="12" fill="#ffffff" fill-opacity="1.0" stroke="currentColor" stroke-opacity="1.0" stroke-width="1.3"/><text x="235" y="219" font-size="13.569999999999999" text-anchor="middle" font-weight="bold" fill="currentColor" fill-opacity="1.0" font-family="inherit">vs</text><text x="235" y="258" font-size="12.979999999999999" text-anchor="middle" font-weight="normal" fill="currentColor" fill-opacity="0.82" font-family="inherit">each into the same 20 closed backgrounds</text><rect x="20" y="276" width="430" height="54" rx="9" fill="#1BAF7A" fill-opacity="0.1" stroke="currentColor" stroke-opacity="1.0" stroke-width="1.6"/><text x="235" y="298.0" font-size="14.75" text-anchor="middle" font-weight="bold" fill="currentColor" fill-opacity="1.0" font-family="inherit">effect = log₂( element ⁄ same sequence shuffled )</text><text x="235" y="317.0" font-size="12.979999999999999" text-anchor="middle" font-weight="normal" fill="currentColor" fill-opacity="0.85" font-family="inherit">the host contributes to both, so it cancels</text><text x="20" y="356.0" font-size="12.979999999999999" text-anchor="start" font-weight="normal" fill="currentColor" fill-opacity="0.8" font-family="inherit">50 donor elements per class; backgrounds are genomic</text><text x="20" y="373.7" font-size="12.979999999999999" text-anchor="start" font-weight="normal" fill="currentColor" fill-opacity="0.8" font-family="inherit">windows with no called ATAC peak</text><text x="530" y="24" font-size="15.93" text-anchor="start" font-weight="bold" fill="currentColor" fill-opacity="1.0" font-family="inherit">Swap  —  the element, or the place it sits?</text><text x="530" y="64" font-size="15.93" text-anchor="start" font-weight="bold" fill="currentColor" fill-opacity="1.0" font-family="inherit">donor</text><text x="530" y="81" font-size="13.569999999999999" text-anchor="start" font-weight="normal" fill="currentColor" fill-opacity="0.72" font-family="inherit">where the sequence comes from</text><rect x="860" y="50" width="250" height="22" rx="4" fill="#EB6834" fill-opacity="0.1" stroke="#EB6834" stroke-opacity="1.0" stroke-width="1.3"/><rect x="977" y="47" width="16" height="28" rx="3" fill="#D9A32B" fill-opacity="0.75" stroke="#D9A32B" stroke-opacity="1.0" stroke-width="1.3"/><text x="530" y="134" font-size="15.93" text-anchor="start" font-weight="bold" fill="currentColor" fill-opacity="1.0" font-family="inherit">recipient</text><text x="530" y="151" font-size="13.569999999999999" text-anchor="start" font-weight="normal" fill="currentColor" fill-opacity="0.72" font-family="inherit">the location it is written into</text><rect x="860" y="120" width="250" height="22" rx="4" fill="currentColor" fill-opacity="0.055" stroke="currentColor" stroke-opacity="1.0" stroke-width="1.3"/><rect x="977" y="117" width="16" height="28" rx="3" fill="#D9A32B" fill-opacity="0.35" stroke="#D9A32B" stroke-opacity="1.0" stroke-width="1.2"/><polyline points="1125,61 1150,61 1150,131 1114,131" fill="none" fill-opacity="0.0" stroke="#EB6834" stroke-width="1.6" marker-end="url(#p3e)"/><text x="1000" y="100" font-size="12.979999999999999" text-anchor="start" font-weight="normal" fill="currentColor" fill-opacity="1.0" font-family="inherit"></text><text x="530" y="196" font-size="15.93" text-anchor="start" font-weight="bold" fill="currentColor" fill-opacity="1.0" font-family="inherit">result</text><text x="530" y="213" font-size="13.569999999999999" text-anchor="start" font-weight="normal" fill="currentColor" fill-opacity="0.72" font-family="inherit">donor sequence, recipient location</text><rect x="860" y="182" width="250" height="22" rx="4" fill="currentColor" fill-opacity="0.035" stroke="currentColor" stroke-opacity="1.0" stroke-width="1.3"/><rect x="860" y="179" width="250" height="28" rx="3" fill="#EB6834" fill-opacity="0.3" stroke="#EB6834" stroke-opacity="1.0" stroke-width="1.3"/><rect x="977" y="176" width="16" height="34" rx="3" fill="#D9A32B" fill-opacity="0.75" stroke="#D9A32B" stroke-opacity="1.0" stroke-width="1.3"/><rect x="530" y="240" width="580" height="48" rx="9" fill="currentColor" fill-opacity="0.04" stroke="currentColor" stroke-opacity="1.0" stroke-width="1.5"/><text x="820" y="260.0" font-size="14.16" text-anchor="middle" font-weight="bold" fill="currentColor" fill-opacity="1.0" font-family="inherit">two widths: the 170 bp window, and the whole peak</text><text x="820" y="278.0" font-size="13.569999999999999" text-anchor="middle" font-weight="normal" fill="currentColor" fill-opacity="0.9" font-family="inherit">every element into every other location — 62,250 swaps</text><rect x="530" y="300" width="580" height="52" rx="9" fill="#1BAF7A" fill-opacity="0.1" stroke="currentColor" stroke-opacity="1.0" stroke-width="1.6"/><text x="820" y="321.0" font-size="14.16" text-anchor="middle" font-weight="bold" fill="currentColor" fill-opacity="1.0" font-family="inherit">regress the swapped site's ATAC on both:</text><text x="820" y="339.0" font-size="13.569999999999999" text-anchor="middle" font-weight="normal" fill="currentColor" fill-opacity="0.9" font-family="inherit">what the donor was, and what the recipient location was</text><text x="530" y="370.0" font-size="12.979999999999999" text-anchor="start" font-weight="normal" fill="currentColor" fill-opacity="0.8" font-family="inherit">Each donor appears in about 250 swaps, so the intervals come from</text><text x="530" y="387.7" font-size="12.979999999999999" text-anchor="start" font-weight="normal" fill="currentColor" fill-opacity="0.8" font-family="inherit">a cluster bootstrap over donors, not from the 62,250 rows.</text></svg>