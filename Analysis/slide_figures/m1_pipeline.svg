<svg viewBox="0 0 1000 398" width="1000" height="398" role="img" aria-label="How an effect is measured" xmlns="http://www.w3.org/2000/svg"><defs><marker id="p1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker><marker id="p1e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#EB6834"/></marker><marker id="p1c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1BAF7A"/></marker><marker id="p1g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D9A32B"/></marker></defs><rect x="20" y="56" width="212" height="74" rx="9" fill="currentColor" fill-opacity="0.03" stroke="currentColor" stroke-opacity="1.0" stroke-width="1.5"/><text x="126" y="82.0" font-size="14.16" text-anchor="middle" font-weight="normal" fill="currentColor" fill-opacity="1.0" font-family="inherit">One fibroblast AP-1 site</text><text x="126" y="100.28999999999999" font-size="14.16" text-anchor="middle" font-weight="normal" fill="currentColor" fill-opacity="1.0" font-family="inherit">TOBIAS footprint, 11 bp</text><text x="126" y="118.58" font-size="14.16" text-anchor="middle" font-weight="normal" fill="currentColor" fill-opacity="1.0" font-family="inherit">5,018 sites</text><rect x="20" y="198" width="212" height="74" rx="9" fill="currentColor" fill-opacity="0.03" stroke="currentColor" stroke-opacity="1.0" stroke-width="1.5"/><text x="126" y="224.0" font-size="14.16" text-anchor="middle" font-weight="normal" fill="currentColor" fill-opacity="1.0" font-family="inherit">131,072 bp of mm10</text><text x="126" y="242.29" font-size="14.16" text-anchor="middle" font-weight="normal" fill="currentColor" fill-opacity="1.0" font-family="inherit">centred on the motif</text><text x="126" y="260.58" font-size="14.16" text-anchor="middle" font-weight="normal" fill="currentColor" fill-opacity="1.0" font-family="inherit">fetched once</text><line x1="126" y1="130" x2="126" y2="196" stroke="currentColor" stroke-opacity="1.0" stroke-width="1.4" marker-end="url(#p1)"/><text x="136" y="168" font-size="12.979999999999999" text-anchor="start" font-weight="normal" fill="currentColor" fill-opacity="0.7" font-family="inherit">fetch once</text><rect x="262" y="48" width="212" height="74" rx="9" fill="#111111" fill-opacity="0.05" stroke="#111111" stroke-opacity="1.0" stroke-width="1.7"/><text x="368" y="74.0" font-size="14.75" text-anchor="middle" font-weight="bold" fill="currentColor" fill-opacity="1.0" font-family="inherit">NATIVE sequence</text><text x="368" y="94.06" font-size="14.75" text-anchor="middle" font-weight="bold" fill="currentColor" fill-opacity="1.0" font-family="inherit">unchanged</text><rect x="262" y="190" width="212" height="92" rx="9" fill="#EB6834" fill-opacity="0.08" stroke="#EB6834" stroke-opacity="1.0" stroke-width="1.7"/><text x="368" y="214.0" font-size="14.75" text-anchor="middle" font-weight="bold" fill="currentColor" fill-opacity="1.0" font-family="inherit">EDITED sequence</text><text x="368" y="234.0" font-size="13.569999999999999" text-anchor="middle" font-weight="normal" fill="currentColor" fill-opacity="1.0" font-family="inherit">shuffle · mutate · insert · swap</text><text x="368" y="251.7" font-size="13.569999999999999" text-anchor="middle" font-weight="normal" fill="currentColor" fill-opacity="1.0" font-family="inherit">10 replicate edits per site</text><polyline points="232,235 248,235 248,85 260,85" fill="none" fill-opacity="0.0" stroke="currentColor" stroke-width="1.4" marker-end="url(#p1)"/><polyline points="232,235 260,235" fill="none" fill-opacity="0.0" stroke="currentColor" stroke-width="1.4" marker-end="url(#p1)"/><rect x="518" y="48" width="196" height="234" rx="9" fill="currentColor" fill-opacity="0.045" stroke="currentColor" stroke-opacity="1.0" stroke-width="1.7"/><text x="616" y="76.0" font-size="15.34" text-anchor="middle" font-weight="bold" fill="currentColor" fill-opacity="1.0" font-family="inherit">AlphaGenome</text><text x="616" y="100.0" font-size="13.569999999999999" text-anchor="middle" font-weight="normal" fill="currentColor" fill-opacity="1.0" font-family="inherit">fine-tuned 1 bp ATAC head</text><text x="616" y="117.7" font-size="13.569999999999999" text-anchor="middle" font-weight="normal" fill="currentColor" fill-opacity="1.0" font-family="inherit">on our own fibroblast Tn5 data</text><line x1="540" y1="128" x2="692" y2="128" stroke="currentColor" stroke-opacity="0.25" stroke-width="1"/><text x="616" y="150.0" font-size="13.569999999999999" text-anchor="middle" font-weight="normal" fill="currentColor" fill-opacity="1.0" font-family="inherit">held-out Spearman 0.68</text><text x="616" y="167.7" font-size="13.569999999999999" text-anchor="middle" font-weight="normal" fill="currentColor" fill-opacity="1.0" font-family="inherit">(0.27 for the built-in head)</text><line x1="540" y1="174" x2="692" y2="174" stroke="currentColor" stroke-opacity="0.25" stroke-width="1"/><text x="616" y="196.0" font-size="13.569999999999999" text-anchor="middle" font-weight="normal" fill="currentColor" fill-opacity="1.0" font-family="inherit">trackset FB = the mean of</text><text x="616" y="213.7" font-size="13.569999999999999" text-anchor="middle" font-weight="normal" fill="currentColor" fill-opacity="1.0" font-family="inherit">the four conditions</text><text x="616" y="231.4" font-size="13.569999999999999" text-anchor="middle" font-weight="normal" fill="currentColor" fill-opacity="1.0" font-family="inherit">(young/old × sed/exercise)</text><text x="616" y="258.0" font-size="12.979999999999999" text-anchor="middle" font-weight="normal" fill="currentColor" fill-opacity="0.7" font-family="inherit">same weights for both lanes</text><line x1="474" y1="85" x2="516" y2="85" stroke="#111111" stroke-opacity="1.0" stroke-width="1.7" marker-end="url(#p1)"/><line x1="474" y1="235" x2="516" y2="235" stroke="#EB6834" stroke-opacity="1.0" stroke-width="1.7" marker-end="url(#p1e)"/><rect x="758" y="48" width="206" height="74" rx="9" fill="none" fill-opacity="0" stroke="#111111" stroke-opacity="1.0" stroke-width="1.7"/><text x="861" y="72.0" font-size="14.75" text-anchor="middle" font-weight="bold" fill="currentColor" fill-opacity="1.0" font-family="inherit">native ATAC</text><text x="861" y="92.0" font-size="13.569999999999999" text-anchor="middle" font-weight="normal" fill="currentColor" fill-opacity="1.0" font-family="inherit">mean over the motif,</text><text x="861" y="109.7" font-size="13.569999999999999" text-anchor="middle" font-weight="normal" fill="currentColor" fill-opacity="1.0" font-family="inherit">the 170 bp and the peak</text><rect x="758" y="190" width="206" height="92" rx="9" fill="none" fill-opacity="0" stroke="#EB6834" stroke-opacity="1.0" stroke-width="1.7"/><text x="861" y="222.0" font-size="14.75" text-anchor="middle" font-weight="bold" fill="#EB6834" fill-opacity="1.0" font-family="inherit">edited ATAC</text><text x="861" y="244.0" font-size="13.569999999999999" text-anchor="middle" font-weight="normal" fill="currentColor" fill-opacity="1.0" font-family="inherit">the same regions,</text><text x="861" y="261.7" font-size="13.569999999999999" text-anchor="middle" font-weight="normal" fill="currentColor" fill-opacity="1.0" font-family="inherit">the same tracks</text><line x1="714" y1="85" x2="756" y2="85" stroke="#111111" stroke-opacity="1.0" stroke-width="1.7" marker-end="url(#p1)"/><line x1="714" y1="235" x2="756" y2="235" stroke="#EB6834" stroke-opacity="1.0" stroke-width="1.7" marker-end="url(#p1e)"/><rect x="518" y="320" width="422" height="58" rx="9" fill="#1BAF7A" fill-opacity="0.1" stroke="currentColor" stroke-opacity="1.0" stroke-width="1.7"/><text x="729" y="344.0" font-size="15.93" text-anchor="middle" font-weight="bold" fill="currentColor" fill-opacity="1.0" font-family="inherit">effect = log₂( (edited + c) ⁄ (native + c) )</text><text x="729" y="364.0" font-size="13.569999999999999" text-anchor="middle" font-weight="normal" fill="currentColor" fill-opacity="1.0" font-family="inherit">averaged over the replicate edits — one number per site</text><polyline points="964,85 980,85 980,349 942,349" fill="none" fill-opacity="0.0" stroke="#111111" stroke-width="1.4" marker-end="url(#p1)"/><polyline points="861,282 861,318" fill="none" fill-opacity="0.0" stroke="#EB6834" stroke-width="1.4" marker-end="url(#p1e)"/><text x="20" y="318.0" font-size="13.569999999999999" text-anchor="start" font-weight="normal" fill="currentColor" fill-opacity="0.8" font-family="inherit">The two predictions come from the same 131 kb</text><text x="20" y="336.88" font-size="13.569999999999999" text-anchor="start" font-weight="normal" fill="currentColor" fill-opacity="0.8" font-family="inherit">window, so a change can only come from the edit.</text><text x="20" y="355.76" font-size="13.569999999999999" text-anchor="start" font-weight="normal" fill="currentColor" fill-opacity="0.8" font-family="inherit">c is 5% of the median native value, which keeps</text><text x="20" y="374.64" font-size="13.569999999999999" text-anchor="start" font-weight="normal" fill="currentColor" fill-opacity="0.8" font-family="inherit">the ratio stable near zero.</text></svg>