<svg viewBox="0 0 1100 380" width="1100" height="380" role="img" aria-label="The element swap" xmlns="http://www.w3.org/2000/svg"><defs><marker id="p3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker><marker id="p3e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#EB6834"/></marker><marker id="p3c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1BAF7A"/></marker><marker id="p3g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D9A32B"/></marker></defs><text x="20" y="66" font-size="15.93" text-anchor="start" font-weight="bold" fill="currentColor" fill-opacity="1.0" font-family="inherit">Donor</text><text x="20" y="83" font-size="13.569999999999999" text-anchor="start" font-weight="normal" fill="currentColor" fill-opacity="0.72" font-family="inherit">where the sequence comes from</text><rect x="250" y="50" width="420" height="26" rx="4" fill="#EB6834" fill-opacity="0.1" stroke="#EB6834" stroke-opacity="1.0" stroke-width="1.3"/><rect x="450" y="46" width="18" height="34" rx="3" fill="#D9A32B" fill-opacity="0.75" stroke="#D9A32B" stroke-opacity="1.0" stroke-width="1.3"/><text x="20" y="148" font-size="15.93" text-anchor="start" font-weight="bold" fill="currentColor" fill-opacity="1.0" font-family="inherit">Recipient</text><text x="20" y="165" font-size="13.569999999999999" text-anchor="start" font-weight="normal" fill="currentColor" fill-opacity="0.72" font-family="inherit">the location it is written into</text><rect x="250" y="132" width="420" height="26" rx="4" fill="currentColor" fill-opacity="0.055" stroke="currentColor" stroke-opacity="1.0" stroke-width="1.3"/><rect x="450" y="128" width="18" height="34" rx="3" fill="#D9A32B" fill-opacity="0.3" stroke="#D9A32B" stroke-opacity="1.0" stroke-width="1.2"/><text x="20" y="230" font-size="15.93" text-anchor="start" font-weight="bold" fill="currentColor" fill-opacity="1.0" font-family="inherit">Result</text><text x="20" y="247" font-size="13.569999999999999" text-anchor="start" font-weight="normal" fill="currentColor" fill-opacity="0.72" font-family="inherit">donor sequence, recipient location</text><rect x="250" y="214" width="420" height="26" rx="4" fill="currentColor" fill-opacity="0.035" stroke="currentColor" stroke-opacity="1.0" stroke-width="1.3"/><rect x="250" y="210" width="420" height="34" rx="3" fill="#EB6834" fill-opacity="0.26" stroke="#EB6834" stroke-opacity="1.0" stroke-width="1.3"/><rect x="450" y="210" width="18" height="34" rx="3" fill="#D9A32B" fill-opacity="0.75" stroke="#D9A32B" stroke-opacity="1.0" stroke-width="1.3"/><polyline points="682,63 706,63 706,145 684,145" fill="none" fill-opacity="0.0" stroke="#EB6834" stroke-width="1.7" marker-end="url(#p3e)"/><rect x="752" y="48" width="328" height="72" rx="9" fill="currentColor" fill-opacity="0.04" stroke="currentColor" stroke-opacity="1.0" stroke-width="1.5"/><text x="916" y="72.0" font-size="14.75" text-anchor="middle" font-weight="bold" fill="currentColor" fill-opacity="1.0" font-family="inherit">Two widths</text><text x="916" y="92.0" font-size="13.569999999999999" text-anchor="middle" font-weight="normal" fill="currentColor" fill-opacity="1.0" font-family="inherit">the 170 bp window,</text><text x="916" y="110.88" font-size="13.569999999999999" text-anchor="middle" font-weight="normal" fill="currentColor" fill-opacity="1.0" font-family="inherit">and the whole peak</text><rect x="752" y="136" width="328" height="72" rx="9" fill="currentColor" fill-opacity="0.04" stroke="currentColor" stroke-opacity="1.0" stroke-width="1.5"/><text x="916" y="160.0" font-size="14.75" text-anchor="middle" font-weight="bold" fill="currentColor" fill-opacity="1.0" font-family="inherit">62,250 swaps</text><text x="916" y="180.0" font-size="13.569999999999999" text-anchor="middle" font-weight="normal" fill="currentColor" fill-opacity="1.0" font-family="inherit">every element into every other</text><text x="916" y="198.88" font-size="13.569999999999999" text-anchor="middle" font-weight="normal" fill="currentColor" fill-opacity="1.0" font-family="inherit">location; self-swaps excluded</text><rect x="250" y="258" width="830" height="60" rx="9" fill="#1BAF7A" fill-opacity="0.1" stroke="currentColor" stroke-opacity="1.0" stroke-width="1.6"/><text x="665" y="281.0" font-size="15.34" text-anchor="middle" font-weight="bold" fill="currentColor" fill-opacity="1.0" font-family="inherit">regress the swapped site's accessibility on both:</text><text x="665" y="301.0" font-size="13.569999999999999" text-anchor="middle" font-weight="normal" fill="currentColor" fill-opacity="0.85" font-family="inherit">what the donor element was, and where the recipient location was</text><text x="250" y="340.0" font-size="13.569999999999999" text-anchor="start" font-weight="normal" fill="currentColor" fill-opacity="0.8" font-family="inherit">Each donor appears in about 250 of those rows, so the confidence intervals come from</text><text x="250" y="360.06" font-size="13.569999999999999" text-anchor="start" font-weight="normal" fill="currentColor" fill-opacity="0.8" font-family="inherit">a cluster bootstrap over donors, not from the 62,250 swaps.</text></svg>