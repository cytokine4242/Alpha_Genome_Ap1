<svg viewBox="0 0 1100 366" width="1100" height="366" role="img" aria-label="Transplant into closed chromatin" xmlns="http://www.w3.org/2000/svg"><defs><marker id="p2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker><marker id="p2e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#EB6834"/></marker><marker id="p2c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1BAF7A"/></marker><marker id="p2g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D9A32B"/></marker></defs><text x="20" y="62" font-size="15.93" text-anchor="start" font-weight="bold" fill="currentColor" fill-opacity="1.0" font-family="inherit">The element</text><text x="20" y="79" font-size="13.569999999999999" text-anchor="start" font-weight="normal" fill="currentColor" fill-opacity="0.72" font-family="inherit">its whole peak, lifted out</text><rect x="250" y="48" width="320" height="26" rx="4" fill="currentColor" fill-opacity="0.055" stroke="currentColor" stroke-opacity="1.0" stroke-width="1.3"/><rect x="400" y="44" width="18" height="34" rx="3" fill="#D9A32B" fill-opacity="0.75" stroke="#D9A32B" stroke-opacity="1.0" stroke-width="1.3"/><text x="409" y="36" font-size="12.979999999999999" text-anchor="middle" font-weight="bold" fill="#8A6400" fill-opacity="1.0" font-family="inherit">AP-1</text><line x1="409" y1="82" x2="409" y2="118" stroke="currentColor" stroke-opacity="1.0" stroke-width="1.4" marker-end="url(#p2)"/><rect x="250" y="126" width="200" height="108" rx="9" fill="#111111" fill-opacity="0.045" stroke="#111111" stroke-opacity="1.0" stroke-width="1.5"/><text x="350" y="150" font-size="14.75" text-anchor="middle" font-weight="bold" fill="#111111" fill-opacity="1.0" font-family="inherit">the element</text><text x="350" y="168" font-size="13.569999999999999" text-anchor="middle" font-weight="normal" fill="currentColor" fill-opacity="0.75" font-family="inherit">as it is</text><line x1="266" y1="194" x2="434" y2="194" stroke="#9A9993" stroke-opacity="0.22" stroke-width="2.4"/><line x1="266" y1="204" x2="434" y2="204" stroke="#9A9993" stroke-opacity="0.45" stroke-width="2.4"/><line x1="266" y1="214" x2="434" y2="214" stroke="#9A9993" stroke-opacity="1.0" stroke-width="2.4"/><rect x="320" y="201" width="60" height="26" rx="4" fill="#111111" fill-opacity="0.1" stroke="#111111" stroke-opacity="1.0" stroke-width="1.3"/><rect x="343" y="197" width="14" height="34" rx="3" fill="#D9A32B" fill-opacity="0.75" stroke="#D9A32B" stroke-opacity="1.0" stroke-width="1.2"/><rect x="490" y="126" width="200" height="108" rx="9" fill="#EB6834" fill-opacity="0.045" stroke="#EB6834" stroke-opacity="1.0" stroke-width="1.5"/><text x="590" y="150" font-size="14.75" text-anchor="middle" font-weight="bold" fill="#EB6834" fill-opacity="1.0" font-family="inherit">the same letters</text><text x="590" y="168" font-size="13.569999999999999" text-anchor="middle" font-weight="normal" fill="currentColor" fill-opacity="0.75" font-family="inherit">shuffled</text><line x1="506" y1="194" x2="674" y2="194" stroke="#9A9993" stroke-opacity="0.22" stroke-width="2.4"/><line x1="506" y1="204" x2="674" y2="204" stroke="#9A9993" stroke-opacity="0.45" stroke-width="2.4"/><line x1="506" y1="214" x2="674" y2="214" stroke="#9A9993" stroke-opacity="1.0" stroke-width="2.4"/><rect x="572" y="202" width="36" height="24" rx="3" fill="#EB6834" fill-opacity="0.45" stroke="#EB6834" stroke-opacity="1.0" stroke-width="1.1"/><rect x="458" y="166" width="28" height="28" rx="14" fill="#ffffff" fill-opacity="1.0" stroke="currentColor" stroke-opacity="1.0" stroke-width="1.3"/><text x="472" y="185" font-size="14.16" text-anchor="middle" font-weight="bold" fill="currentColor" fill-opacity="1.0" font-family="inherit">vs</text><text x="470" y="254" font-size="13.569999999999999" text-anchor="middle" font-weight="normal" fill="currentColor" fill-opacity="0.82" font-family="inherit">each into the same 20 closed backgrounds</text><rect x="250" y="278" width="440" height="62" rx="9" fill="#1BAF7A" fill-opacity="0.1" stroke="currentColor" stroke-opacity="1.0" stroke-width="1.6"/><text x="470" y="302.0" font-size="15.34" text-anchor="middle" font-weight="bold" fill="currentColor" fill-opacity="1.0" font-family="inherit">effect = log₂( element ⁄ same sequence shuffled )</text><text x="470" y="323.0" font-size="13.569999999999999" text-anchor="middle" font-weight="normal" fill="currentColor" fill-opacity="0.85" font-family="inherit">the host contributes to both, so it cancels</text><text x="752" y="150.0" font-size="14.75" text-anchor="start" font-weight="normal" fill="currentColor" fill-opacity="1.0" font-family="inherit">50 donor elements per class</text><text x="752" y="177.14" font-size="14.75" text-anchor="start" font-weight="normal" fill="currentColor" fill-opacity="1.0" font-family="inherit">20 backgrounds each</text><text x="752" y="204.28" font-size="14.75" text-anchor="start" font-weight="normal" fill="currentColor" fill-opacity="1.0" font-family="inherit">scored at the whole-peak width</text><text x="752" y="240.0" font-size="13.569999999999999" text-anchor="start" font-weight="normal" fill="currentColor" fill-opacity="0.8" font-family="inherit">A background is a genomic window with no</text><text x="752" y="260.06" font-size="13.569999999999999" text-anchor="start" font-weight="normal" fill="currentColor" fill-opacity="0.8" font-family="inherit">called ATAC peak, so there is nothing there</text><text x="752" y="280.12" font-size="13.569999999999999" text-anchor="start" font-weight="normal" fill="currentColor" fill-opacity="0.8" font-family="inherit">for the element to add to.</text></svg>